<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6ea6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Casa Fabiana">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>Casa Fabiana</title>
</head>
<body>
<header class="hero">
  <div>
    <p class="kicker">CASA FABIANA</p>
    <h1 id="greeting">Olá, Fabiana</h1>
    <p id="dateLabel"></p>
  </div>
  <button id="notifyBtn" class="round" aria-label="Ativar alertas">🔔</button>
</header>

<main>
  <section class="card summary">
    <div class="summary-line">
      <span>Progresso de hoje</span>
      <strong id="summaryCount">0 de 0</strong>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
    <p id="nextTask" class="next">Próxima tarefa: —</p>
    <button id="startCleaning" class="primary">▶ Iniciar faxina</button>
  </section>

  <nav class="tabs">
    <button class="tab active" data-target="today">Hoje</button>
    <button class="tab" data-target="agenda">Agenda</button>
    <button class="tab" data-target="history">Histórico</button>
    <button class="tab" data-target="settings">Ajustes</button>
  </nav>

  <section id="today" class="panel active">
    <div class="section-title">
      <h2>Tarefas de hoje</h2>
      <button id="resetDay" class="link">Reiniciar</button>
    </div>
    <div id="todayList" class="list"></div>
  </section>

  <section id="agenda" class="panel">
    <div class="section-title">
      <h2>Agenda semanal</h2>
      <button id="resetAgendaDay" class="link">Reiniciar dia</button>
    </div>
    <div id="weekdayChips" class="chips"></div>
    <div id="agendaList" class="list"></div>

    <div class="card calendar-card">
      <h3>Lembretes mensais</h3>
      <div id="monthlyList" class="agenda-summary"></div>
      <button id="downloadCalendar" class="primary">Baixar para o Calendário do iPhone</button>
      <p class="hint">Os alertas do Calendário funcionam mesmo com o aplicativo fechado.</p>
    </div>
  </section>

  <section id="history" class="panel">
    <div class="section-title">
      <h2>Histórico</h2>
      <button id="clearHistory" class="link danger-link">Apagar</button>
    </div>
    <div id="historySummary" class="stats-grid"></div>
    <div id="historyList" class="history-list"></div>
  </section>

  <section id="settings" class="panel">
    <h2>Ajustes</h2>
    <div class="card settings-card">
      <label class="switch-row">
        <span>
          <b>Alertas no navegador</b>
          <small>Funcionam enquanto o app está aberto.</small>
        </span>
        <input id="browserAlerts" type="checkbox">
      </label>
      <button id="exportBackup" class="secondary">Exportar backup</button>
      <label class="secondary file-label">
        Importar backup
        <input id="importBackup" type="file" accept="application/json">
      </label>
      <button id="clearData" class="danger">Apagar todos os dados</button>
    </div>
  </section>
</main>

<div id="focusModal" class="modal hidden">
  <div class="sheet focus-sheet">
    <button id="closeFocus" class="close" aria-label="Fechar">×</button>
    <p class="kicker blue">MODO FAXINA</p>
    <h2 id="focusTitle">Próxima tarefa</h2>
    <p id="focusMeta" class="focus-meta"></p>
    <p id="focusDetails" class="focus-details"></p>
    <button id="focusDone" class="primary">Concluir e avançar</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
